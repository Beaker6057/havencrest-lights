<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Suggest a Song · Havencrest Lights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Embedded on havencrestlights.remotefalcon.com below the Show Hours card.
     Sends to the Google Form "Havencrest Lights Song Requests" (owner smarthome6057).
     If a question is changed in that Google Form, update the entry IDs in FIELDS below. */
  :root{
    --accent:#ff8a00; --muted:#c7b3e6; --slime:#a6ff00;
    --card:rgba(20,6,36,.72); --card-border:rgba(190,140,255,.22);
    --field:rgba(255,255,255,.08); --field-border:rgba(255,255,255,.14);
    --ok:#1f9d3a; --err:#d9480f;
    --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:#fff;font-family:var(--body);-webkit-text-size-adjust:100%}
  .card{
    position:relative;overflow:hidden;
    padding:12px 12px 12px;border-radius:16px;
    background:var(--card);border:1px solid var(--card-border);
  }
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
  .head b{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--slime)}
  .head span{font-size:12px;font-weight:700;color:var(--muted)}
  form{display:grid;grid-template-columns:1.25fr 1fr auto;gap:8px}
  input{
    min-width:0;width:100%;height:44px;padding:0 12px;border-radius:12px;
    font:700 16px/1 var(--body);color:#fff;
    background:var(--field);border:1px solid var(--field-border);
    -webkit-appearance:none;appearance:none;
  }
  input::placeholder{color:rgba(255,255,255,.45)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,0,.25)}
  button{
    height:44px;padding:0 14px;border:0;border-radius:999px;cursor:pointer;
    background:var(--accent);color:#12051f;font:900 15px/1 var(--body);
    box-shadow:0 0 10px rgba(255,138,0,.45);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.6}
  /* very narrow phones: Send drops under the two boxes */
  @media (max-width:330px){ form{grid-template-columns:1fr 1fr} button{grid-column:1 / -1} }
  .toast{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:12px 16px;border-radius:16px;text-align:center;
    font:800 16px/1.35 var(--body);color:#fff;
    opacity:0;visibility:hidden;transform:scale(.98);
    transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s;
  }
  .toast.show{opacity:1;visibility:visible;transform:none;transition:opacity .2s ease,transform .2s ease}
  .toast.ok{background:var(--ok)}
  .toast.err{background:var(--err)}
</style>
</head>
<body>
<div class="card">
  <div class="head"><b>✨ Don't see your song?</b><span>Suggest one</span></div>
  <form id="f" autocomplete="off">
    <input id="song" name="song" placeholder="Song" maxlength="80" required aria-label="Song">
    <input id="artist" name="artist" placeholder="Artist" maxlength="60" aria-label="Artist (optional)">
    <button id="send" type="submit">Send</button>
  </form>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script>
(function () {
  var FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSfdQBv0CuFMbOBBzcZ3U5XDaYhQ_1F5DcyRtsWCYtcmhY_u1Q/formResponse';
  var FIELDS = { song: 'entry.957715055', artist: 'entry.1891441635' };
  var f = document.getElementById('f'), btn = document.getElementById('send'), toast = document.getElementById('toast');
  var timer = null;

  function show(kind, text, ms) {
    clearTimeout(timer);
    toast.className = 'toast ' + kind + ' show';
    toast.textContent = text;
    timer = setTimeout(function () { toast.className = 'toast ' + kind; }, ms);
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var song = document.getElementById('song').value.trim();
    var artist = document.getElementById('artist').value.trim();
    if (!song) { document.getElementById('song').focus(); return; }
    btn.disabled = true;
    var body = new URLSearchParams();
    body.append(FIELDS.song, song);
    if (artist) body.append(FIELDS.artist, artist);
    body.append('fvv', '1');
    body.append('pageHistory', '0');
    fetch(FORM, { method: 'POST', mode: 'no-cors', body: body })
      .then(function () {
        f.reset();
        if (document.activeElement) document.activeElement.blur();
        show('ok', '🎃 Thanks! We got your suggestion.', 3000);
      })
      .catch(function () {
        show('err', "Couldn't send. Check your signal and try again.", 3500);
      })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
